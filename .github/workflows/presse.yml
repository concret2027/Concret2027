name: Presse (articles qui citent les candidats)

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      chaine:
        description: 'relancé par le relevé précédent'
        required: false
        default: 'non'

permissions:
  contents: write
  actions: write

concurrency:
  group: presse
  cancel-in-progress: true

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Branche donnees-presse dans arch/
        run: |
          git config --global user.name "Concret"
          git config --global user.email "noreply@concret2027.fr"
          if git ls-remote --exit-code --heads origin donnees-presse >/dev/null; then
            git fetch --depth 1 origin donnees-presse
            git worktree add -B donnees-presse arch FETCH_HEAD
          else
            git worktree add --orphan -b donnees-presse arch
          fi

      - name: Relevé des flux
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.chaine }}" != "oui" ]; then MODE=--agreger; else MODE=--agreger-si-besoin; fi
          python3 outils/presse.py --archive arch/presse_archive.json --ecrire --live arch/presse_live.json $MODE
          # Page du taux d'emprunt à 10 ans (Idéal Investisseur) : la mise à jour quotidienne la lit ici quand le site refuse sa connexion directe.
          curl -sS -m 60 -A 'Mozilla/5.0 (concret2027.fr)' -o arch/taux_oat_bund.html.tmp https://www.ideal-investisseur.fr/en/markets/oat-bund-spread.html && grep -q 'OAT' arch/taux_oat_bund.html.tmp && mv arch/taux_oat_bund.html.tmp arch/taux_oat_bund.html || rm -f arch/taux_oat_bund.html.tmp

      - name: Archive sur donnees-presse
        working-directory: arch
        run: |
          git add presse_archive.json presse_live.json
          git add taux_oat_bund.html 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Presse : relevé $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin donnees-presse || { git fetch --depth 1 origin donnees-presse && git rebase FETCH_HEAD && git push origin donnees-presse; }

      - name: Compte du jour sur main
        run: |
          git add donnees/presse.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Presse : articles qui citent les candidats, $(date -u +%Y-%m-%d)"
          git push origin HEAD:main || { git pull -q --rebase origin main && git push origin HEAD:main; }

      # GitHub ne lance pas toujours les relevés programmés : chaque relevé relance le suivant 30 minutes plus tard.
      # Un relevé lancé entre-temps (programmé ou à la main) annule celui qui attend : une seule chaîne à la fois.
      - name: Relance dans 30 minutes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1680
          gh workflow run presse.yml --ref main -R "${{ github.repository }}" -f chaine=oui
