name: Essai GDELT (rien publié)
on:
  push:
    branches: [essai-gdelt]
permissions:
  contents: read
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 outils/essai_gdelt2.py
