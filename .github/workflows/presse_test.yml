name: presse-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: GDELT, deux candidats
        run: |
          for q in "Marine Le Pen" "Jean-Luc Mélenchon"; do
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote('\"'+sys.argv[1]+'\" sourcelang:french'))" "$q")
            curl -s -m 60 -w "\nHTTP %{http_code}\n" "https://api.gdeltproject.org/api/v2/doc/doc?query=$enc&mode=timelinevolraw&timespan=14d&format=json" | tail -c 600
            sleep 8
          done
